name: Build & Release

# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wydanie powstaje tylko po wypchnięciu tagu vX.Y.Z – wersja to nazwa tagu i musi
  # zgadzać się z plikiem VERSION.
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      - name: Wersja
        id: ver
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            if [ "$NAME" != "$BASE" ]; then
              echo "::error::Tag $GITHUB_REF_NAME nie zgadza się z plikiem VERSION ($BASE)"
              exit 1
            fi
          else
            NAME="$BASE-dev.${{ github.run_number }}"
          fi
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy jednostkowe
        run: gradle testDebugUnitTest --stacktrace

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease -PversionCode=${{ needs.version.outputs.code }} -PversionName=${{ needs.version.outputs.name }} --stacktrace

      - name: Przygotowanie plików
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OpenSync-${{ needs.version.outputs.name }}.apk"
          cp tools/opensync-restore.py opensync-restore.py

      - uses: actions/upload-artifact@v5
        with:
          name: OpenSync-${{ needs.version.outputs.name }}-android
          path: |
            OpenSync-${{ needs.version.outputs.name }}.apk
            opensync-restore.py

  release:
    needs: [version, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          NOTES=$(awk -v version="$NAME" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          [ -n "$NOTES" ] || NOTES=$(printf 'Poprawki i ulepszenia.')
          FOOTER=$(printf -- '---\n**Android:** pobierz **OpenSync-%s.apk** i zainstaluj go na telefonie (Android 10+). Kolejne wersje aplikacja pobierze i zainstaluje sama.\n\n**Komputer:** **opensync-restore.py** odczyta i przywróci kopie bez telefonu (Python 3 i `pip install cryptography`).' "$NAME")
          gh release create "$GITHUB_REF_NAME" "dist/OpenSync-$NAME.apk" "dist/opensync-restore.py" \
            --verify-tag \
            --title "OpenSync $NAME" \
            --notes "$(printf '%s\n\n%s' "$NOTES" "$FOOTER")" \
            --latest
